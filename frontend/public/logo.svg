<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Dark Squircle -->
  <rect width="40" height="40" rx="11" fill="#17191c" />

  <!-- Cloud Silhouette Boundary -->
  <path d="M 23 12 C 26.5 12 29.5 14.5 30 18 C 32.5 18.5 34 20.8 34 23.5 C 34 26.5 31.5 29 28.5 29 H 24" stroke="#777b86" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- The Structural 'F' Spine (Left boundary of the Cloud) -->
  <path d="M 11.5 10.5 C 11.5 9.1 12.6 8 14 8 H 15 C 16.4 8 17.5 9.1 17.5 10.5 V 29.5 C 17.5 30.9 16.4 32 15 32 H 14 C 12.6 32 11.5 30.9 11.5 29.5 V 10.5 Z" fill="#ffffff" />

  <!-- Top Cloud Dome that flows into the upper 'F' Crossbar -->
  <path d="M 17.5 8 H 22.5 C 26.5 8 29.5 10.5 30 14 C 30.4 16.8 28.5 19 25.5 19 H 17.5 V 8 Z" fill="#ffffff" />

  <!-- Inner Negative Cut -->
  <path d="M 17.5 13.5 H 22 C 23.8 13.5 24.8 14.6 24.6 15.8 C 24.4 16.8 23.4 17.5 22 17.5 H 17.5 V 13.5 Z" fill="#17191c" />

  <!-- Middle Analytical Cloud Beam ('F' middle arm in Blush Peach) -->
  <path d="M 17.5 21.5 H 25 C 26.4 21.5 27.5 22.6 27.5 24 C 27.5 25.4 26.4 26.5 25 26.5 H 17.5 V 21.5 Z" fill="#fbe1d1" />

  <!-- Cloud Apex Metric Node (Sienna Brown Focal Point) -->
